[package]
name = "miqs_music_prot"
version = "0.0.0"
description = ""
authors = ["you"]
edition = "2024"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]

tokio = { version = "1.48.0", default-features = false, features = [ "rt", "rt-multi-thread", "io-util", "sync", "macros", "io-std", "time" ] }
ymodem-send-rs = {git = "https://github.com/PEARLabo/ymodem-send-rs/", branch="abstract-transfer", features= ["async"] } # ymodemリブ
clap = { version = "4.5.53", features = ["derive"] }
